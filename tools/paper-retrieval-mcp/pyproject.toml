[project]
name = "paper-retrieval-mcp"
version = "0.1.0"
description = "A provider-independent MCP interface for retrieving scientific papers."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.13,<5",
  "httpcore[asyncio]>=1.0.9,<2",
  "httpx[socks]>=0.28,<1",
  "mcp>=2.3,<3",
  "pypdf>=7,<8",
]

[project.scripts]
papers = "paper_retrieval.cli:main"
paper-retrieval-mcp = "paper_retrieval.server:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
